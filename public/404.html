<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — CDH Maker</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#06232e" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at top, #0b3a4a, #03141c 70%); color: #e6f6f9;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    main { max-width: 520px; }
    .code { font-size: 4.5rem; font-weight: 700; color: #22d3ee; margin: 0; letter-spacing: 2px; }
    h1 { font-size: 1.4rem; margin: 6px 0 10px; }
    p { color: #9fc0c9; line-height: 1.5; margin: 0 0 22px; }
    .btn {
      display: inline-block; padding: 12px 22px; border-radius: 12px; text-decoration: none;
      background: #22d3ee; color: #03141c; font-weight: 600;
    }
    nav { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 0.85rem; }
    nav a { color: #9fc0c9; text-decoration: none; }
    nav a:hover { color: #22d3ee; }
  </style>
</head>

<body>
  <main>
    <p class="code">404</p>
    <h1>Esta página no existe · This page doesn't exist</h1>
    <p>El enlace está roto o la página se movió. El portafolio completo de CDH Maker sigue aquí.</p>
    <a class="btn" href="/">Ir al inicio</a>
    <nav aria-label="Idiomas">
      <a href="/" hreflang="es" lang="es">Español</a>
      <a href="/en" hreflang="en" lang="en">English</a>
      <a href="/zh" hreflang="zh" lang="zh">中文</a>
      <a href="/hi" hreflang="hi" lang="hi">हिन्दी</a>
      <a href="/ar" hreflang="ar" lang="ar" dir="rtl">العربية</a>
      <a href="/pt" hreflang="pt" lang="pt">Português</a>
      <a href="/bn" hreflang="bn" lang="bn">বাংলা</a>
      <a href="/ru" hreflang="ru" lang="ru">Русский</a>
      <a href="/fr" hreflang="fr" lang="fr">Français</a>
      <a href="/id" hreflang="id" lang="id">Bahasa Indonesia</a>
    </nav>
  </main>
  <script>
    // Elegir un idioma aquí cuenta como elección explícita (misma clave que i18n.js)
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[hreflang]");
      if (a) try { localStorage.setItem("cdh-lang-v2", a.getAttribute("hreflang")); } catch (_) {}
    });
  </script>
</body>

</html>

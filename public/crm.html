<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel y CRM — CDH Maker</title>
<link rel="icon" href="/brand/isotipo.svg" type="image/svg+xml">
<script>try { var t = localStorage.getItem('cdh_crm_tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}</script>
<link rel="stylesheet" href="/crm/panel.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --noche:#060B14; --noche-2:#0C1624; --marca:#0E2F44; --cian:#22D3EE; --cian-osc:#0891B2; --ojo:#3BA4E6;
    --fondo:#F3F6F9; --linea:#DCE5EC; --txt:#0F1D29; --suave:#5C7080; --ok:#15803D; --err:#B91C1C; --warn:#A16207;
    --sombra:0 1px 2px rgba(6,11,20,.05),0 4px 16px rgba(6,11,20,.05); --radio:14px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, system-ui,'Segoe UI',Roboto,Arial,sans-serif; background: var(--fondo); color: var(--txt); line-height:1.45; font-size:14px; }
  a { color: var(--cian-osc); }
  /* ── estructura: barra lateral + contenido ── */
  .shell { display:grid; grid-template-columns: 248px minmax(0,1fr); min-height:100vh; }
  aside { background: var(--noche); color:#C9D6E2; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:18px 12px; gap:14px; overflow-y:auto; }
  .marca-crm { display:flex; align-items:center; gap:10px; padding:0 8px 14px; border-bottom:1px solid #16243A; text-decoration:none; color:#fff; }
  .marca-crm svg { flex:none; } .marca-crm b { font:700 16px/1.1 "Space Grotesk",sans-serif; letter-spacing:1.5px; display:block; }
  .marca-crm small { color:#7FA3BC; font-size:11px; letter-spacing:.4px; }
  #nav { display:flex; flex-direction:column; gap:2px; }
  #nav a { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; color:#C9D6E2; text-decoration:none; font-weight:500; }
  #nav a:hover { background: var(--noche-2); color:#fff; }
  #nav a.act { background: linear-gradient(90deg, rgba(34,211,238,.16), rgba(34,211,238,.04)); color:#fff; box-shadow: inset 2px 0 0 var(--cian); }
  #nav a.act svg { color: var(--cian); }
  #yo { margin-top:auto; display:flex; align-items:center; gap:8px; padding:10px 6px 0; border-top:1px solid #16243A; }
  #yo .yo { display:flex; gap:9px; align-items:center; text-decoration:none; color:#fff; min-width:0; flex:1; }
  #yo .yo span:last-child { min-width:0; } #yo b { display:block; font-size:13px; } #yo small { display:block; color:#7FA3BC; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #yo button { background:transparent; color:#C9D6E2; border-color:#2A3C55; }
  .avatar { flex:none; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:700; color:var(--noche); background: var(--c, var(--cian)); }
  .barra-movil { display:none; }
  main { padding: 22px 24px 40px; max-width: 1320px; width:100%; }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    aside { position:fixed; inset:0 30% 0 0; z-index:20; transform:translateX(-105%); transition:transform .2s; }
    body.menu-abierto aside { transform:none; box-shadow: 0 0 0 100vmax rgba(6,11,20,.45); }
    .barra-movil { display:flex; align-items:center; gap:10px; background:var(--noche); color:#fff; padding:10px 14px; position:sticky; top:0; z-index:10; }
    .barra-movil button { background:transparent; color:#fff; border-color:#2A3C55; }
    main { padding: 14px 12px 40px; }
  }
  /* ── componentes ── */
  .cols { display:grid; grid-template-columns: 300px minmax(0,1fr); gap:16px; align-items:start; }
  .cols.mitad { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  @media (max-width: 980px) { .cols, .cols.mitad { grid-template-columns: 1fr; } }
  .card { background:#fff; border:1px solid var(--linea); border-radius: var(--radio); padding: 18px; margin-bottom: 16px; min-width:0; box-shadow: var(--sombra); }
  h1.titulo { font:700 22px/1.2 "Space Grotesk",sans-serif; color: var(--noche); margin: 0 0 4px; letter-spacing:.2px; }
  p.bajada { margin:0 0 16px; color: var(--suave); }
  h2 { margin: 0 0 10px; font:700 16px/1.3 "Space Grotesk",sans-serif; color: var(--marca); } h3 { margin: 14px 0 8px; font-size: 14px; color: var(--marca); }
  label { display:block; font-size: 12px; font-weight:600; color: var(--marca); margin: 8px 0 3px; }
  input, textarea, select { width:100%; padding: 8px 10px; font: inherit; border:1px solid #C3D2DC; border-radius:9px; background:#fff; color:var(--txt); }
  input:focus, textarea:focus, select:focus { outline: 2px solid rgba(34,211,238,.45); border-color: var(--cian-osc); }
  input[type=checkbox], input[type=radio] { width:auto; }
  textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; min-height: 120px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 0 12px; }
  button { font: inherit; border-radius: 9px; padding: 7px 14px; border: 1px solid var(--marca); background:#fff; color: var(--marca); cursor:pointer; font-weight:600; }
  button:hover { border-color: var(--cian-osc); }
  button.primario { background: var(--noche); border-color: var(--noche); color:#fff; }
  button.primario:hover { background: var(--marca); }
  button.peligro { border-color: var(--err); color: var(--err); }
  button.mini { padding: 3px 10px; font-size: 12px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .lista { list-style:none; margin:0; padding:0; }
  .lista li { padding: 9px 11px; border-radius: 10px; cursor:pointer; border:1px solid transparent; }
  .lista li:hover { background: var(--fondo); } .lista li.act { background:#E6F7FB; border-color: var(--cian); }
  .lista small { display:block; color: var(--suave); }
  .chip { display:inline-block; padding: 1px 9px; border-radius: 20px; font-size: 12px; font-weight:600; border:1px solid; white-space:nowrap; }
  .chip.pendiente { color: var(--warn); border-color:#F2D9A4; background:#FFF8E6; }
  .chip.firmado, .chip.ensamblada, .chip.firmada, .chip.ok { color: var(--ok); border-color:#BFE5CB; background:#E8F6EC; }
  .chip.vencido, .chip.anulado, .chip.anulada { color: var(--err); border-color:#F4C3C3; background:#FDECEC; }
  .chip.parcial, .chip.info { color: var(--marca); border-color:#C5DEEA; background:#EAF4F9; }
  .chip.neutro { color: var(--suave); border-color: var(--linea); background:#F6F8FA; }
  table { width:100%; border-collapse: collapse; } td, th { text-align:left; padding: 7px 8px; border-bottom:1px solid var(--linea); vertical-align: top; }
  th { font-size:12px; color: var(--suave); font-weight:600; }
  .tabla { overflow-x:auto; }
  .sol { border:1px solid var(--linea); border-radius:12px; padding: 12px; margin-bottom: 12px; }
  .cab, .sol .cab { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center; }
  .aviso { padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-top:10px; }
  .aviso.ok { background:#E8F6EC; color: var(--ok); } .aviso.err { background:#FDECEC; color: var(--err); } .aviso.info { background:#EAF4F9; color: var(--marca); } .aviso.warn { background:#FFF8E6; color: var(--warn); }
  .suave { color: var(--suave); font-size: 12px; } code { font-size: 12px; word-break: break-all; }
  .centro { text-align:center; padding: 40px 16px; }
  .oculto { display:none !important; }
  .vacio { color: var(--suave); text-align:center; padding: 22px 8px; border:1px dashed var(--linea); border-radius: 12px; }
  a.boton { display:inline-block; text-decoration:none; border-radius:9px; padding:6px 13px; border:1px solid var(--marca); background:#fff; color:var(--marca); font-weight:600; font-size:13px; }
  a.boton.primario { background:var(--noche); border-color:var(--noche); color:#fff; }
  tr.fila { cursor:pointer; } tr.fila:hover td { background: var(--fondo); }
  /* indicadores y pestañas */
  .kpis { display:grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:#fff; border:1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px; box-shadow: var(--sombra); }
  .kpi span { display:block; color: var(--suave); font-size:12px; font-weight:500; }
  .kpi b { display:block; font:700 20px/1.25 "Space Grotesk",sans-serif; color: var(--noche); margin-top:2px; }
  .kpi small { display:block; color: var(--suave); font-size:11px; margin-top:2px; }
  .kpi.ok b { color: var(--ok); } .kpi.err b { color: var(--err); } .kpi.warn b { color: var(--warn); } .kpi.cian b { color: var(--cian-osc); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin: 0 0 14px; }
  .tab { padding: 6px 13px; border-radius: 20px; border:1px solid var(--linea); background:#fff; color: var(--marca); font-weight:600; font-size:13px; text-decoration:none; }
  .tab.act { background: var(--noche); color:#fff; border-color: var(--noche); }
  .tab small { opacity:.7; font-weight:500; }
  /* editor de documentos */
  .editor { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width: 1180px) { .editor { grid-template-columns: 1fr; } }
  .editor textarea.texto, textarea.texto { font-family:inherit; font-size:13px; min-height:70px; }
  .vista { position:sticky; top:12px; } .vista iframe { width:100%; height:calc(100vh - 110px); min-height:520px; border:1px solid var(--linea); border-radius:10px; background:#eef3f5; }
  table.items { min-width:640px; } table.items td { padding:4px 3px; } table.items input, table.items select { padding:6px; font-size:13px; }
  .totales { margin:10px 0 0 auto; max-width:300px; } .totales div { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--linea); }
  .totales .gran { font-size:16px; color:var(--marca); border-bottom:0; }
  select.mini { padding:3px 6px; font-size:12px; border-radius:8px; }
  fieldset:disabled input, fieldset:disabled select, fieldset:disabled textarea { background:#F6F9FB; color:var(--txt); }
  dialog.modal { border:1px solid var(--linea); border-radius: 16px; padding: 20px; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 60px rgba(6,11,20,.3); color: var(--txt); }
  dialog.modal::backdrop { background: rgba(6,11,20,.5); }
  .firma-pre { display:inline-grid; place-items:center; min-width:220px; min-height:90px; padding:8px; border:1px dashed var(--linea); border-radius:12px; background:#FBFDFE; }
  .firma-pre img { max-width:260px; max-height:110px; }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <a class="marca-crm" href="#inicio" id="marcaCrm"><span><b>CDH MAKER</b><small>Consola de la empresa</small></span></a>
    <nav id="nav"></nav>
    <div id="yo"></div>
  </aside>
  <div>
    <div class="barra-movil"><button type="button" class="mini" onclick="document.body.classList.toggle('menu-abierto')" aria-label="Menú">☰</button><b>CDH MAKER</b></div>
    <main id="app"><div class="card centro"><h2>Cargando…</h2></div></main>
  </div>
</div>
<script type="module" src="/crm/app.js?v=9"></script>

</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRM — CDH Maker</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --marca:#0B3C5D; --cian:#68B8D0; --fondo:#F2F7FA; --linea:#D5E1E8; --txt:#10202B; --suave:#5B6F7C; --ok:#15803D; --err:#B91C1C; --warn:#A16207; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,'Segoe UI',Roboto,Arial,sans-serif; background: var(--fondo); color: var(--txt); line-height:1.45; font-size:14px; }
  header { background: var(--marca); color:#fff; padding: 12px 16px; }
  header .in { max-width: 1200px; margin: 0 auto; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header b { font-size: 17px; letter-spacing:.5px; } header span { color:#BFE3EE; font-size: 13px; }
  header nav { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  header nav button { background:transparent; color:#fff; border-color:#5d8aa6; padding:6px 12px; }
  header nav button.act { background:#fff; color:var(--marca); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .cols { display:grid; grid-template-columns: 280px 1fr; gap:16px; align-items:start; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .card { background:#fff; border:1px solid var(--linea); border-radius: 12px; padding: 16px; margin-bottom: 16px; min-width:0; }
  h2 { margin: 0 0 10px; font-size: 17px; color: var(--marca); } h3 { margin: 14px 0 8px; font-size: 15px; color: var(--marca); }
  label { display:block; font-size: 12px; font-weight:600; color: var(--marca); margin: 8px 0 3px; }
  input, textarea, select { width:100%; padding: 8px 10px; font: inherit; border:1px solid #B8C9D3; border-radius:8px; background:#fff; }
  textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; min-height: 120px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 0 12px; }
  button { font: inherit; border-radius: 8px; padding: 7px 14px; border: 1px solid var(--marca); background:#fff; color: var(--marca); cursor:pointer; font-weight:600; }
  button.primario { background: var(--marca); color:#fff; }
  button.peligro { border-color: var(--err); color: var(--err); }
  button.mini { padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .lista { list-style:none; margin:0; padding:0; }
  .lista li { padding: 8px 10px; border-radius: 8px; cursor:pointer; border:1px solid transparent; }
  .lista li:hover { background: var(--fondo); } .lista li.act { background:#E3F0F6; border-color: var(--cian); }
  .lista small { display:block; color: var(--suave); }
  .chip { display:inline-block; padding: 1px 9px; border-radius: 20px; font-size: 12px; font-weight:600; border:1px solid; white-space:nowrap; }
  .chip.pendiente { color: var(--warn); border-color:#F2D9A4; background:#FFF8E6; }
  .chip.firmado, .chip.ensamblada, .chip.firmada { color: var(--ok); border-color:#BFE5CB; background:#E8F6EC; }
  .chip.vencido, .chip.anulado, .chip.anulada { color: var(--err); border-color:#F4C3C3; background:#FDECEC; }
  .chip.parcial { color: var(--marca); border-color:#C5DEEA; background:#EAF4F9; }
  table { width:100%; border-collapse: collapse; } td, th { text-align:left; padding: 6px 8px; border-bottom:1px solid var(--linea); vertical-align: top; }
  th { font-size:12px; color: var(--suave); font-weight:600; }
  .sol { border:1px solid var(--linea); border-radius:10px; padding: 12px; margin-bottom: 12px; }
  .sol .cab { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center; }
  .aviso { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top:10px; }
  .aviso.ok { background:#E8F6EC; color: var(--ok); } .aviso.err { background:#FDECEC; color: var(--err); } .aviso.info { background:#EAF4F9; color: var(--marca); }
  .suave { color: var(--suave); font-size: 12px; } code { font-size: 12px; word-break: break-all; }
  .centro { text-align:center; padding: 40px 16px; }
  .oculto { display:none !important; }
</style>
</head>
<body>
<header><div class="in"><div><b>CDH MAKER</b> <span>CRM · expedientes y firma electrónica</span></div><nav id="nav"></nav></div></header>
<main id="app"><div class="card centro"><h2>Cargando…</h2></div></main>
<script type="module" src="/crm/app.js?v=2"></script>
</body>
</html>

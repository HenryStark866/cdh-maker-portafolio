<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Firma de documentos — CDH Maker</title>
  <meta name="description" content="Portal privado de CDH Maker para leer, aceptar y firmar electrónicamente los documentos de su proyecto." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="firma.css?v=1" />
</head>
<body>
  <!-- ═══════════════════════════════════════════════════════════════════════
       CDH MAKER — firma.html
       Portal privado de firma electrónica. Cada cliente recibe un enlace
       /firma#<token> y, por otro canal, un código. Los documentos llegan
       cifrados (/e/<token>.json) y solo se descifran en el navegador con ese
       código. Lógica en firma.js; generación de expedientes en
       tools/expediente.mjs. Ver ARQUITECTURA.md.
       ═══════════════════════════════════════════════════════════════════════ -->
  <header class="barra">
    <a class="marca" href="/" aria-label="CDH Maker, ir al inicio">
      <svg viewBox="0 0 512 512" width="34" height="34" aria-hidden="true"><rect width="512" height="512" rx="104" fill="#06232e"/><g transform="translate(56.5,56.5) scale(5.7)"><path d="M55 15H25A15 15 0 0 0 10 30v10a15 15 0 0 0 15 15h30" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="square"/><path d="M55 15H25A15 15 0 0 0 10 30v2h15V22" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/><circle cx="25" cy="22" r="3" fill="#22d3ee"/><path d="M10 45v-5a15 15 0 0 1 15 15h20V42" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/><circle cx="45" cy="42" r="3" fill="#22d3ee"/><circle cx="10" cy="45" r="3" fill="#22d3ee"/></g></svg>
      <span>CDH Maker</span>
    </a>
    <span class="barra-sub">Portal de firma electrónica</span>
  </header>

  <main id="app" class="contenedor" aria-live="polite">
    <noscript><p class="aviso">Este portal necesita JavaScript para descifrar y firmar los documentos.</p></noscript>
  </main>

  <!-- Visor de documentos (pantalla completa) -->
  <div id="visor" class="visor" role="dialog" aria-modal="true" aria-labelledby="visorTitulo" hidden>
    <div class="visor-barra">
      <button type="button" class="btn btn-texto" data-accion="cerrar-visor">← Volver</button>
      <strong id="visorTitulo"></strong>
      <button type="button" class="btn btn-sec" data-accion="imprimir">Descargar PDF</button>
    </div>
    <div class="visor-progreso"><span id="visorBarra"></span></div>
    <iframe id="visorMarco" title="Documento" sandbox="allow-same-origin allow-modals"></iframe>
    <p id="visorPie" class="visor-pie"></p>
  </div>

  <footer class="pie">
    CDH Maker · Medellín, Colombia · cdhmaker@gmail.com ·
    Firma electrónica conforme a la Ley 527 de 1999 y el Decreto 2364 de 2012
  </footer>
  <script src="firma.js?v=1" defer></script>
</body>
</html>
